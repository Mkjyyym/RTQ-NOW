name: RTQ NOW APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Release key from repo secrets; falls back to the auto debug key so the
      # workflow still produces an installable APK before secrets are set.
      - name: Decode release keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            ./gradlew :app:assembleGithubRelease
          else
            ./gradlew :app:assembleGithubDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rtqnow-apk
          path: app/build/outputs/apk/github/*/*.apk

      - name: Publish release assets (built-in token, no PAT)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rtqnow-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/github/*/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RTQ NOW $TAG (experimental)" \
            --notes "Experimental build. Based on Flow (GPLv3). Untested on device unless stated otherwise."
