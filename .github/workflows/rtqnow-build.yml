name: RTQ NOW APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Release key from repo secrets; falls back to the auto debug key so the
      # workflow still produces an installable APK before secrets are set.
      - name: Apply RTQ NOW strings and developer photo
        run: |
          python3 scripts/rtqnow_apply_strings.py app/src/main/res
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d scripts/developer_photo.webp.b64 > app/src/main/res/drawable-nodpi/developer_photo.webp
          echo "$(cat scripts/developer_photo.sha256)  app/src/main/res/drawable-nodpi/developer_photo.webp" | sha256sum -c -

      - name: Build debug APK (CI debug key, no secrets)
        run: ./gradlew :app:assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: rtqnow-apk
          path: app/build/outputs/apk/github/*/*.apk

      - name: Publish release assets (built-in token, no PAT)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rtqnow-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/github/*/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RTQ NOW $TAG (experimental)" \
            --notes "Experimental build. Based on Flow (GPLv3). Untested on device unless stated otherwise."
